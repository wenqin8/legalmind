name: legalmind-m1-infrastructure

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: legalmind_smoke
      POSTGRES_USER: legalmind
      POSTGRES_PASSWORD: ${LEGALMIND_POSTGRES_PASSWORD:?configure backend/.env first}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - legalmind-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legalmind -d legalmind_smoke"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:8-alpine
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${LEGALMIND_REDIS_PASSWORD:?configure backend/.env first}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - legalmind-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=$${LEGALMIND_REDIS_PASSWORD} redis-cli ping | grep PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      LEGALMIND_REDIS_PASSWORD: ${LEGALMIND_REDIS_PASSWORD:?configure backend/.env first}

volumes:
  legalmind-postgres-data:
  legalmind-redis-data:
