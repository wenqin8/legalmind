# Logs omit URLs/query strings and tokens. Backend logs retain request IDs.
log_format safe '$remote_addr $request_method $status $request_time';
server {
    listen 80;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;
    access_log /var/log/nginx/access.log safe;
    client_max_body_size 64k;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # No trust is placed in client-supplied forwarding headers.
        proxy_set_header X-Forwarded-For "";
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
    }
    location /assets/ { try_files $uri =404; }
    location / { try_files $uri $uri/ /index.html; }
}
